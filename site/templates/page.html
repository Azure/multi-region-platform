<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F6CBD'/%3E%3Ccircle cx='11' cy='13' r='4' fill='%23fff'/%3E%3Ccircle cx='21' cy='13' r='4' fill='%23fff' opacity='.7'/%3E%3Ccircle cx='16' cy='21' r='4' fill='%23fff' opacity='.45'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('mrp-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="assets/figures.css">
<link rel="stylesheet" href="assets/site.css">{{HEAD}}
</head>
<body class="{{BODYCLASS}}">
{{SPRITE}}
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <button class="nav-toggle" type="button" aria-label="Table of contents" aria-expanded="false" aria-controls="side-nav">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="index.html" aria-label="{{SITE_TITLE}} home">
    <svg class="guidance-logo" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M8 9 16 23 24 9M9 8h14" fill="none" stroke="#7FB9EA" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="8" cy="8" r="4.5" fill="#0F6CBD" stroke="white" stroke-width="1.5"/>
      <circle cx="24" cy="8" r="4.5" fill="#2BC7B4" stroke="white" stroke-width="1.5"/>
      <circle cx="16" cy="24" r="4.5" fill="#8661C5" stroke="white" stroke-width="1.5"/>
    </svg>
    <span class="brand-sep"></span>
    <span class="brand-name">{{SITE_TITLE}}</span>
    <span class="brand-tag">Architecture Guidance</span>
  </a>
  <div class="search" role="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5"/></svg>
    <input id="q" type="search" placeholder="Search this guidance" autocomplete="off" aria-label="Search this guidance">
    <kbd>Ctrl K</kbd>
    <div class="results" id="results" hidden></div>
  </div>
  <div class="top-actions">
    <div class="dl">
      <button class="btn-dl" type="button" aria-expanded="false" aria-controls="dl-menu">
        <svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Downloads
      </button>
      <div class="dl-menu" id="dl-menu" hidden>{{DOWNLOADS}}</div>
    </div>
    <button class="theme" type="button" aria-label="Toggle dark theme" title="Toggle theme">
      <svg class="sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.4"/></svg>
      <svg class="moon" viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7Z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

{{HERO}}

<div class="nav-backdrop" hidden></div>
<div class="shell">
  <nav class="side" id="side-nav" aria-label="Table of contents">
    <div class="side-in">
      <ul class="nav">{{NAV}}</ul>
    </div>
    <div class="side-pdfs">
      <a class="side-pdf" href="downloads/Adaptable-Multi-Region-Azure-Platform.pdf" download><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Technical guidance<small>PDF · 57 pages</small></span></a>
      <a class="side-pdf" href="downloads/Adaptable-Multi-Region-Azure-Platform-Executive-Brief.pdf" download><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Executive brief<small>PDF · 14 pages</small></span></a>
    </div>
  </nav>

  <main id="main">
    <div class="crumbs">{{CRUMBS}}</div>
    <h1 class="title">{{H1}}</h1>
    <p class="meta">{{META}}</p>
    <article class="prose">{{BODY}}</article>
    {{PAGER}}
  </main>

  <aside class="rail" aria-label="In this article">
    <div class="rail-in">
      <p class="rail-h">In this article</p>
      <ul>{{RAIL}}</ul>
    </div>
  </aside>
</div>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Expanded figure">
  <button class="lb-close" type="button" aria-label="Close">×</button>
  <div class="lb-stage"></div>
</div>

<script src="assets/site.js"></script>{{SCRIPTS}}
</body>
</html>
