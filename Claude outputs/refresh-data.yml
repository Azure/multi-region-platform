# Refreshes the Azure data snapshot that the region planning workbook reads (docs/data/).
# The script reads the public Azure Retail Prices API. It needs no secrets.
name: Refresh Azure data snapshot

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the snapshot
        run: python3 site/tools/refresh_data.py
      - name: Commit the snapshot if it changed
        run: |
          git add docs/data
          if git diff --cached --quiet; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Azure data snapshot"
            git push
          fi
