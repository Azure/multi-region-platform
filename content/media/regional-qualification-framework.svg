<text x="837.0" y="377.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">Access to network hubs and other</text>
<text x="837.0" y="396.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">shared platform services, and</text>
<text x="837.0" y="415.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">other regions</text>
