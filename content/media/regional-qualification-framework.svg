<text x="1138.0" y="243.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Latency, pricing, and scale</text>
<circle cx="1127.0" cy="264.4" r="2.6" fill="#1B2F4E" stroke="none" stroke-width="1"/>
<text x="1138.0" y="269.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Regional access and quota</text>
<circle cx="1127.0" cy="290.4" r="2.6" fill="#1B2F4E" stroke="none" stroke-width="1"/>
<text x="1138.0" y="295.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Service-specific</text>
<text x="1138.0" y="315.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">cross-region behavior</text>
<path d="M1104 460H1350V580Q1350 588 1342 588H1112Q1104 588 1104 580Z" fill="#EDF1F6"/>
<text x="1124.0" y="484.0" font-size="11.5" font-weight="600" fill="#1B2F4E" text-anchor="start" letter-spacing="1.6">DECISION</text>
<text x="1124.0" y="506.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">Qualify candidates,</text>
<text x="1124.0" y="527.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">documenting conditions,</text>
<text x="1124.0" y="548.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">constraints, and unresolved</text>
<text x="1124.0" y="569.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">validations.</text>
<rect x="24.0" y="602.0" width="1326.0" height="108.0" rx="10" fill="#F5F7FA" stroke="none" stroke-width="1"/>
<text x="44.0" y="634.0" font-size="17" font-weight="600" fill="#242424" text-anchor="start">Qualification outcome</text>
<text x="44.0" y="656.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">Each regional option is classified</text>
<text x="44.0" y="675.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">against <tspan font-weight="600" fill="#242424">defined</tspan> <tspan font-weight="600" fill="#242424">workload</tspan></text>
<text x="44.0" y="694.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start"><tspan font-weight="600" fill="#242424">requirements</tspan>, with evidence.</text>
