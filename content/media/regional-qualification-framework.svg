<text x="330.0" y="355.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Restrictions on data</text>
<text x="330.0" y="375.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">movement or operational</text>
<text x="330.0" y="395.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">control</text>
