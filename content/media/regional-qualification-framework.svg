<text x="628.0" y="54.0" font-size="17" font-weight="600" fill="#242424" text-anchor="start">Workload requirements and dependencies</text>
<text x="588.0" y="103.0" font-size="15" font-weight="600" fill="#06605C" text-anchor="start">What workload requirements and dependencies must the region</text>
<text x="588.0" y="124.0" font-size="15" font-weight="600" fill="#06605C" text-anchor="start">support?</text>
<text x="588.0" y="171.0" font-size="11.5" font-weight="600" fill="#06605C" text-anchor="start" letter-spacing="1.6">FROM THE WORKLOADS</text>
<text x="837.0" y="171.0" font-size="11.5" font-weight="600" fill="#06605C" text-anchor="start" letter-spacing="1.6">REQUIRED FROM THE PLATFORM</text>
