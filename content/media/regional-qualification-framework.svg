<text x="885.0" y="656.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Supported if documented</text>
<text x="885.0" y="674.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">conditions are resolved.</text>
