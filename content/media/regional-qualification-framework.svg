<text x="602.0" y="197.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Existing and future workloads,</text>
<text x="602.0" y="217.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">including moves</text>
<circle cx="591.0" cy="238.4" r="2.6" fill="#0B7A75" stroke="none" stroke-width="1"/>
<text x="602.0" y="243.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Closest-fitting Workload</text>
<text x="602.0" y="263.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Landing Zone archetype</text>
<circle cx="591.0" cy="284.4" r="2.6" fill="#0B7A75" stroke="none" stroke-width="1"/>
<text x="602.0" y="289.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Data, connectivity, and shared</text>
<text x="602.0" y="309.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">services</text>
<circle cx="591.0" cy="330.4" r="2.6" fill="#0B7A75" stroke="none" stroke-width="1"/>
<text x="602.0" y="335.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Security, resiliency, and scale</text>
<circle cx="591.0" cy="356.4" r="2.6" fill="#0B7A75" stroke="none" stroke-width="1"/>
<text x="602.0" y="361.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Required Azure services</text>
