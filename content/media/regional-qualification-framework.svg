<text x="1164.0" y="54.0" font-size="17" font-weight="600" fill="#242424" text-anchor="start">Regional capability</text>
<text x="1164.0" y="76.0" font-size="17" font-weight="600" fill="#242424" text-anchor="start">and availability</text>
<text x="1124.0" y="103.0" font-size="15" font-weight="600" fill="#1B2F4E" text-anchor="start">Which regions can support</text>
<text x="1124.0" y="124.0" font-size="15" font-weight="600" fill="#1B2F4E" text-anchor="start">the identified workload</text>
<text x="1124.0" y="145.0" font-size="15" font-weight="600" fill="#1B2F4E" text-anchor="start">requirements?</text>
<circle cx="1127.0" cy="166.4" r="2.6" fill="#1B2F4E" stroke="none" stroke-width="1"/>
<text x="1138.0" y="171.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Services, models, and SKUs</text>
<circle cx="1127.0" cy="192.4" r="2.6" fill="#1B2F4E" stroke="none" stroke-width="1"/>
<text x="1138.0" y="197.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Availability zones and</text>
<text x="1138.0" y="217.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">pairing</text>
