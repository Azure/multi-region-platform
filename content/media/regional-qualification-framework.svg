<text x="837.0" y="217.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">Services needed locally, remotely,</text>
<text x="837.0" y="236.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">or centrally</text>
<path d="M837.0 263.0L1058.0 263.0" fill="none" stroke="#E0E0E0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
