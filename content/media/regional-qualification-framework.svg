<text x="623.5" y="636.0" font-size="16" font-weight="600" fill="#0F6CBD" text-anchor="start">Candidate</text>
<text x="623.5" y="656.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">Potentially viable; more</text>
<text x="623.5" y="674.0" font-size="13" font-weight="400" fill="#616161" text-anchor="start">discovery or validation first.</text>
