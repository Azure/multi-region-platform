<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1374 729" width="1374" height="729" font-family="'Segoe UI Variable Text', 'Segoe UI', Aptos, Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Regional qualification: four checks and outcomes</title><desc id="d">Four checks — business and geography, data and compliance, workload requirements and dependencies, regional capability and availability — each with a decision, leading to an outcome of Excluded, Candidate, Conditional or Qualified.</desc>
