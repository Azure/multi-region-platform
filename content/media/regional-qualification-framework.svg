<text x="588.0" y="484.0" font-size="11.5" font-weight="600" fill="#06605C" text-anchor="start" letter-spacing="1.6">DECISION</text>
<text x="588.0" y="506.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">Identify and record the workload-driven platform requirements.</text>
