<text x="44.0" y="527.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">value to justify deeper</text>
<text x="44.0" y="548.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">assessment.</text>
