<text x="837.0" y="297.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">Reachability and resilience to</text>
<text x="837.0" y="316.0" font-size="13.5" font-weight="400" fill="#616161" text-anchor="start">Azure</text>
