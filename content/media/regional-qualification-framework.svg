<text x="316.0" y="527.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">cannot satisfy a mandatory</text>
<text x="316.0" y="548.0" font-size="15" font-weight="600" fill="#242424" text-anchor="start">requirement.</text>
