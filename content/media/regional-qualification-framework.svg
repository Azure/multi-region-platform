<text x="356.0" y="54.0" font-size="17" font-weight="600" fill="#242424" text-anchor="start">Data and</text>
<text x="356.0" y="76.0" font-size="17" font-weight="600" fill="#242424" text-anchor="start">compliance</text>
<text x="316.0" y="103.0" font-size="15" font-weight="600" fill="#A8460A" text-anchor="start">Are we allowed to operate</text>
<text x="316.0" y="124.0" font-size="15" font-weight="600" fill="#A8460A" text-anchor="start">here?</text>
<circle cx="319.0" cy="166.4" r="2.6" fill="#A8460A" stroke="none" stroke-width="1"/>
<text x="330.0" y="171.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Data residency and</text>
<text x="330.0" y="191.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">sovereignty</text>
<circle cx="319.0" cy="212.4" r="2.6" fill="#A8460A" stroke="none" stroke-width="1"/>
<text x="330.0" y="217.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Regulatory and industry</text>
<text x="330.0" y="237.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">requirements</text>
<circle cx="319.0" cy="258.4" r="2.6" fill="#A8460A" stroke="none" stroke-width="1"/>
<text x="330.0" y="263.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Company policy and</text>
<text x="330.0" y="283.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">customer commitments</text>
