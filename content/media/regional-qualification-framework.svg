<text x="58.0" y="335.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Geographic concentration</text>
<text x="58.0" y="355.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">risk</text>
