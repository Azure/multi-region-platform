<text x="58.0" y="197.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">Datacenter and partner</text>
<text x="58.0" y="217.0" font-size="14" font-weight="400" fill="#424242" text-anchor="start">locations</text>
