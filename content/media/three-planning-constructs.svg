<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1365 480" width="1365" height="480" font-family="'Segoe UI Variable Text', 'Segoe UI', Aptos, Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Platform readiness: advance planning and workload adoption</title><desc id="d">Workload Landing Zone Archetypes describe what applications require; Platform Services profiles describe what the platform provides; Regional Qualification evaluates candidate regions. Together they produce governed regional options, which are revalidated against each application at onboarding.</desc>
