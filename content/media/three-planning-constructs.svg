<text x="501.7" y="136.0" font-size="14.5" font-weight="400" fill="#616161" text-anchor="start">Describe <tspan font-weight="600" fill="#0B7A75">what</tspan> <tspan font-weight="600" fill="#0B7A75">applications</tspan> <tspan font-weight="600" fill="#0B7A75">require</tspan> — recurring</text>
<text x="501.7" y="157.0" font-size="14.5" font-weight="400" fill="#616161" text-anchor="start">dependency and connectivity characteristics.</text>
